<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a Class • Lotus Spirit Studio</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    body{
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: #f6f2ee;
    }

    .lotus-navbar {
      background-color: #4d0012 !important;
      padding-top: 1.75rem;
      padding-bottom: 1.75rem;
    }

    .lotus-navbar .nav-link {
      color: #b89056 !important;
      font-weight: 500;
    }

    .lotus-navbar .nav-link:hover {
      color: #ffd9a2 !important;
    }

    .card-soft{
      border: none;
      border-radius: 1rem;
    }

    .btn-primary{
      background-color: #b89056;
      border-color: #b89056;
      font-weight: 600;
    }

    .btn-primary:hover{
      background-color: #ffd9a2;
      border-color: #ffd9a2;
      color: #4d0012;
    }

    .summary-pill{
      background: rgba(184,144,86,0.14);
      border: 1px solid rgba(184,144,86,0.45);
      border-radius: 12px;
      padding: 12px 14px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg lotus-navbar border-bottom">
    <div class="container position-relative">

      <ul class="navbar-nav me-auto d-flex flex-row gap-4 align-items-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
        <li class="nav-item"><a class="nav-link" href="videos.html">Videos</a></li>
      </ul>

      <a class="navbar-brand position-absolute top-50 start-50 translate-middle" href="index.html">
        <img src="Lotus Spirit_Logo_2.3.png" alt="Lotus Spirit Studio Logo" height="80" />
      </a>

      <div class="ms-auto d-flex align-items-center">
        <a href="login.html" class="nav-link" title="Login / Profile">
          <svg xmlns="http://www.w3.org/2000/svg"
               width="24"
               height="24"
               fill="currentColor"
               class="bi bi-person-circle"
               viewBox="0 0 16 16">
            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
            <path fill-rule="evenodd"
              d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
          </svg>
        </a>
      </div>

    </div>
  </nav>

  <main class="container py-5">

    <div class="row justify-content-center g-4">
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm card-soft">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Book a Class</h1>
            <p class="text-secondary mb-4">Enter your details and submit your booking.</p>

            <div id="bookingAlert" class="alert alert-danger d-none" role="alert"></div>
            <div id="bookingSuccess" class="alert alert-success d-none" role="alert"></div>

            <form id="bookingForm" novalidate>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label" for="firstName">First name</label>
                  <input class="form-control" id="firstName" type="text" required />
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="lastName">Last name</label>
                  <input class="form-control" id="lastName" type="text" required />
                </div>

                <div class="col-12">
                  <label class="form-label" for="email">Email</label>
                  <input class="form-control" id="email" type="email" required />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="phone">Phone (optional)</label>
                  <input class="form-control" id="phone" type="tel" />
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="notes">Notes (optional)</label>
                  <input class="form-control" id="notes" type="text" placeholder="Injuries, preferences, etc." />
                </div>

                <div class="col-12">
                  <div class="form-check mt-2">
                    <input class="form-check-input" type="checkbox" id="agree" />
                    <label class="form-check-label" for="agree">
                      I agree to the studio policies (placeholder for now).
                    </label>
                  </div>
                </div>
              </div>

              <hr class="my-4">
              <!-- Stripe Payment -->
<h2 class="h5 mb-2">Payment</h2>

<p class="text-secondary small mb-3">
  You’ll be redirected to Stripe to complete your payment securely.
</p>

<button id="submitBtn" class="btn btn-primary w-100 mt-4" type="submit">
  Continue to Secure Payment
</button>
            </form>

          </div>
        </div>
      </div>

      <!-- Class summary -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm card-soft">
          <div class="card-body p-4 p-md-5">
            <h2 class="h5 mb-3">Class Summary</h2>

            <div class="summary-pill">
              <div class="fw-semibold" id="sumService">—</div>
              <div class="text-secondary" id="sumDateTime">—</div>
              <div class="text-secondary" id="sumStaff">—</div>
              <div class="text-secondary" id="sumLocation">—</div>
              <div class="mt-2 fw-semibold" id="sumPrice">—</div>
            </div>

            <p class="text-secondary small mt-3 mb-0">
              Booking confirmation is stored locally for now (no backend yet).
            </p>
          </div>
        </div>
      </div>

    </div>
  </main>
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabaseClient.js"></script>
<script src="booking.js"></script>
</body>
</html>
