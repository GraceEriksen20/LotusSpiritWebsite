<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Book Class • Lotus Spirit Studio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('Fonts/Manrope-Regular.ttf') format('truetype');
    }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #f6f2ee;
    }

    .lotus-navbar {
      background-color: #4d0012;
      padding-top: 1.75rem;
      padding-bottom: 1.75rem;
    }

    .lotus-navbar .navbar-brand,
    .lotus-navbar .nav-link {
      color: #b89056;
      font-weight: 500;
    }

    .lotus-navbar .nav-link:hover {
      color: #ffd9a2;
    }

    .page-card {
      border: none;
      border-radius: 1.25rem;
      overflow: hidden;
    }

    .summary-card {
      background: rgba(255,255,255,0.7);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(0,0,0,0.08);
    }

    .muted {
      color: #6d5b5d;
    }

    .btn-primary {
      background-color: #b89056;
      border-color: #b89056;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #ffd9a2;
      border-color: #ffd9a2;
      color: #4d0012;
    }
  </style>
</head>

<body>

<nav class="navbar lotus-navbar border-bottom">
  <div class="container">

    <a class="navbar-brand" href="index.html">
      Lotus Spirit Studio
    </a>

    <div class="ms-auto d-flex align-items-center gap-3">

      <a class="nav-link" href="schedule.html">
        Schedule
      </a>

      <a class="nav-link" href="dashboard.html">
        Dashboard
      </a>

    </div>

  </div>
</nav>

<main class="container py-5">

  <div class="row g-4 justify-content-center">

    <!-- Booking Form -->
    <div class="col-12 col-lg-7">

      <div class="card shadow-sm page-card">
        <div class="card-body p-4 p-md-5">

          <h1 class="h3 mb-2">
            Complete Your Booking
          </h1>

          <p class="muted mb-4">
            Enter your information below to reserve your class.
          </p>

          <div id="bookingAlert"
               class="alert alert-danger d-none"
               role="alert">
          </div>

          <div id="bookingSuccess"
               class="alert alert-success d-none"
               role="alert">
          </div>

          <form id="bookingForm">

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">
                  First Name
                </label>

                <input type="text"
                       id="firstName"
                       class="form-control"
                       required>
              </div>

              <div class="col-md-6">
                <label class="form-label">
                  Last Name
                </label>

                <input type="text"
                       id="lastName"
                       class="form-control"
                       required>
              </div>

              <div class="col-12">
                <label class="form-label">
                  Email
                </label>

                <input type="email"
                       id="email"
                       class="form-control"
                       required>
              </div>

              <div class="col-12">
                <label class="form-label">
                  Phone Number
                </label>

                <input type="tel"
                       id="phone"
                       class="form-control">
              </div>

              <div class="col-12">
                <label class="form-label">
                  Notes
                </label>

                <textarea id="notes"
                          class="form-control"
                          rows="4"></textarea>
              </div>

              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input"
                         type="checkbox"
                         id="agree">

                  <label class="form-check-label" for="agree">
                    I agree to the studio policies.
                  </label>
                </div>
              </div>

            </div>

            <button id="submitBtn"
                    type="submit"
                    class="btn btn-primary w-100 mt-4">
              Complete Booking
            </button>

          </form>

        </div>
      </div>

    </div>

    <!-- Booking Summary -->
    <div class="col-12 col-lg-5">

      <div class="summary-card">

        <h2 class="h5 mb-4">
          Booking Summary
        </h2>

        <div class="mb-3">
          <div class="fw-semibold">
            Service
          </div>

          <div id="sumService" class="muted">
            Loading...
          </div>
        </div>

        <div class="mb-3">
          <div class="fw-semibold">
            Date & Time
          </div>

          <div id="sumDateTime" class="muted">
            Loading...
          </div>
        </div>

        <div class="mb-3">
          <div class="fw-semibold">
            Teacher
          </div>

          <div id="sumStaff" class="muted">
            Loading...
          </div>
        </div>

        <div class="mb-3">
          <div class="fw-semibold">
            Location
          </div>

          <div id="sumLocation" class="muted">
            Loading...
          </div>
        </div>

        <div class="mb-0">
          <div class="fw-semibold">
            Price
          </div>

          <div id="sumPrice" class="muted">
            Loading...
          </div>
        </div>

      </div>

    </div>

  </div>

</main>

<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabaseClient.js"></script>
<script src="booking.js"></script>

</body>
</html>
