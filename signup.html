<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up • Lotus Spirit Studio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* ===============================
       Manrope Font
    =============================== */
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background-color: #f6f2ee;
    }

    /* ===============================
       Navbar
    =============================== */
    .lotus-navbar {
      background-color: #4d0012;
      padding-top: 1.75rem;
      padding-bottom: 1.75rem;
    }

    .lotus-navbar .navbar-brand,
    .lotus-navbar .nav-link {
      color: #b89056;
      font-weight: 500;
    }

    .lotus-navbar .nav-link:hover {
      color: #ffd9a2;
    }

    .navbar-brand {
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* ===============================
       Card
    =============================== */
    .auth-card {
      border: none;
      border-radius: 1rem;
    }

    /* ===============================
       Buttons
    =============================== */
    .btn-primary {
      background-color: #b89056;
      border-color: #b89056;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #ffd9a2;
      border-color: #ffd9a2;
      color: #4d0012;
    }

    /* ===============================
       Links
    =============================== */
    a {
      color: #b89056;
    }

    a:hover {
      color: #ffd9a2;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar lotus-navbar border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        Lotus Spirit Studio
      </a>

      <div class="ms-auto">
        <a class="nav-link" href="login.html">Log In</a>
      </div>
    </div>
  </nav>

  <!-- Sign Up Card -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm auth-card">
          <div class="card-body p-4">
            <h1 class="h4 mb-2">Create your account</h1>
            <p class="text-secondary mb-4">
              Sign up to book classes and access on-demand content.
            </p>

            <div id="signupAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="signupForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" id="name" type="text" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" required>
                <div class="form-text">At least 6 characters.</div>
              </div>

              <button class="btn btn-primary w-100" type="submit">
                Sign Up
              </button>
            </form>

            <hr class="my-4">

            <p class="mb-0 text-secondary small">
              Already have an account?
              <a href="login.html">Log in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Auth Logic -->
  <script src="auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("signupForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const alertBox = document.getElementById("signupAlert");

      if (!name || !email || !password) {
        alertBox.textContent = "Please fill out all fields.";
        alertBox.classList.remove("d-none");
        return;
      }

      if (password.length < 6) {
        alertBox.textContent = "Password must be at least 6 characters.";
        alertBox.classList.remove("d-none");
        return;
      }

      const ok = Auth.register({ name, email, password });
      if (!ok) {
        alertBox.textContent = "That email is already registered. Try logging in.";
        alertBox.classList.remove("d-none");
        return;
      }

      Auth.login({ email });
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
