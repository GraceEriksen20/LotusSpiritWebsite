<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up • Lotus Spirit Studio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Lotus Spirit Studio</a>
      <div class="ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="login.html">Log in</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-2">Create your account</h1>
            <p class="text-secondary mb-4">Demo sign-up for now (we’ll add real verification later).</p>

            <div id="signupAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="signupForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" id="name" type="text" placeholder="Grace Eriksen" required />
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" placeholder="you@example.com" required />
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" type="password" placeholder="••••••••" required />
                <div class="form-text">Demo rule: at least 6 characters.</div>
              </div>

              <button class="btn btn-primary w-100" type="submit">Sign up</button>
            </form>

            <hr class="my-4">

            <p class="mb-0 text-secondary small">
              Already have an account?
              <a href="login.html">Log in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = "dashboard.html";

    document.getElementById("signupForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      const alertBox = document.getElementById("signupAlert");

      if (!name || !email || !password) {
        alertBox.textContent = "Please fill out all fields.";
        alertBox.classList.remove("d-none");
        return;
      }

      if (password.length < 6) {
        alertBox.textContent = "Password must be at least 6 characters.";
        alertBox.classList.remove("d-none");
        return;
      }

      const ok = Auth.register({ name, email, password });

      if (!ok) {
        alertBox.textContent = "That email is already registered. Try logging in.";
        alertBox.classList.remove("d-none");
        return;
      }

      // Auto-login after signup (demo)
      Auth.login({ email });

      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
