<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class Schedule • Lotus Spirit Studio</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>

/* Navbar styling */
.lotus-navbar {
  background-color: #4d0012 !important; /* your maroon */
  padding-top: 1.75rem;
  padding-bottom: 1.75rem;
}

.lotus-navbar .nav-link {
  color: #b89056 !important;
  font-weight: 500;
}

.lotus-navbar .nav-link:hover {
  color: #ffd9a2 !important;
}

.lotus-navbar .nav-link.active {
  color: #ffd9a2 !important;
  border-bottom: 2px solid #ffd9a2;
}

    /* Manrope */
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    :root{
      /* You can tweak these to match the screenshot more literally */
      --page-bg: #f6f2ee;

      /* Lotus palette (current) */
      --accent: #b89056;          /* gold */
      --accent-soft: #ffd9a2;     /* hover */
      --ink: #2a2a2a;
      --muted: #6c757d;
      --selected: #4d0012;        /* maroon (day highlight) */
      --selected-ink: #ffffff;

      --line: rgba(0,0,0,0.10);
      --card: rgba(255,255,255,0.55);
      --btn-border: rgba(184,144,86,0.75);
    }

    body{
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: var(--page-bg);
      color: var(--ink);
    }

    /* Page title */
    .schedule-title{
      font-size: clamp(2rem, 3vw, 2.6rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: center;
      margin: 2.25rem 0 1rem;
    }

    .divider{
      height: 1px;
      background: var(--line);
      margin: 0 auto 1.25rem;
      max-width: 980px;
    }

    /* Filter row */
    .filters{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .filters .label{
      color: var(--muted);
      font-size: 0.95rem;
    }

    .filter-select{
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 0.25rem 0.25rem;
      min-width: 170px;
      color: var(--ink);
      font-weight: 500;
      outline: none;
    }

    .filters .split{
      width: 1px;
      height: 28px;
      background: var(--line);
    }

    /* Week nav */
    .week-nav{
      max-width: 980px;
      margin: 0 auto;
    }

    .month-row{
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      margin: 0.25rem 0 1rem;
    }

    .chev{
      border: none;
      background: transparent;
      font-size: 1.75rem;
      line-height: 1;
      color: rgba(0,0,0,0.45);
      padding: 0;
      cursor: pointer;
    }
    .chev:hover{ color: rgba(0,0,0,0.70); }

    .month-label{
      text-align: center;
      font-weight: 500;
      color: rgba(0,0,0,0.60);
      letter-spacing: 0.02em;
    }

    .week-strip{
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.75rem;
      padding: 0 0.5rem;
    }

    .day-pill{
      text-align: center;
      padding: 0.75rem 0.25rem 0.65rem;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: transform .08s ease, background .08s ease;
    }

    .day-pill:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,0.40);
    }

    .dow{
      font-size: 0.95rem;
      color: rgba(0,0,0,0.60);
      margin-bottom: 0.25rem;
      font-weight: 500;
    }

    .dom{
      font-size: 1.05rem;
      font-weight: 600;
      color: rgba(0,0,0,0.70);
      display: inline-block;
      min-width: 2.1rem;
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
    }

    .dot{
      font-size: 1.25rem;
      line-height: 0.8;
      color: rgba(0,0,0,0.30);
      margin-top: 0.2rem;
    }

    .day-pill.selected .dom{
      background: var(--selected);
      color: var(--selected-ink);
    }

    .day-pill.selected .dow,
    .day-pill.selected .dot{
      color: rgba(0,0,0,0.60);
    }

    /* Availability */
    .availability-wrap{
      max-width: 980px;
      margin: 1.25rem auto 2.5rem;
      padding: 0 0.5rem;
    }

    .availability-title{
      font-size: 1.05rem;
      font-weight: 500;
      margin: 1.0rem 0 0.75rem;
      color: rgba(0,0,0,0.70);
    }

    .list-card{
      background: var(--card);
      border-radius: 14px;
      padding: 0.25rem 0;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .class-row{
      display: grid;
      grid-template-columns: 110px 1.5fr 1.2fr 180px;
      gap: 1rem;
      padding: 1.25rem 1.25rem;
      align-items: center;
    }

    .class-row + .class-row{
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .time{
      font-weight: 500;
      color: rgba(0,0,0,0.70);
    }

    .class-name{
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .sub{
      color: rgba(0,0,0,0.55);
      font-size: 0.95rem;
    }

    .meta{
      color: rgba(0,0,0,0.70);
      font-size: 0.95rem;
      line-height: 1.35;
    }

    .meta .staff{
      font-weight: 500;
    }

    .book-btn{
      justify-self: end;
      width: 160px;
      height: 38px;
      border-radius: 2px;
      background: transparent;
      border: 1px solid var(--btn-border);
      color: rgba(0,0,0,0.75);
      font-weight: 600;
      transition: background .08s ease, color .08s ease, border-color .08s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .book-btn:hover{
      background: rgba(184,144,86,0.18);
      border-color: rgba(184,144,86,1);
      color: rgba(0,0,0,0.85);
    }

    /* Responsive */
    @media (max-width: 992px){
      .class-row{
        grid-template-columns: 90px 1fr;
        grid-template-rows: auto auto auto;
        gap: 0.5rem 1rem;
      }
      .meta{ grid-column: 2 / -1; }
      .book-btn{ grid-column: 2 / -1; justify-self: start; width: 180px; margin-top: 0.35rem; }
    }
  </style>
</head>

<body>

<!-- Site Navbar (matches other pages) -->
<nav class="navbar navbar-expand-lg lotus-navbar border-bottom">
  <div class="container position-relative">

    <!-- Left: Site links -->
    <ul class="navbar-nav me-auto d-flex flex-row gap-4 align-items-center">
      <li class="nav-item">
        <a class="nav-link" href="index.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active fw-semibold" href="schedule.html">Schedule</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="videos.html">Videos</a>
      </li>
    </ul>

    <!-- Center: Logo -->
    <a class="navbar-brand position-absolute top-50 start-50 translate-middle" href="index.html">
      <img
        src="Lotus Spirit_Logo_2.3.png"
        alt="Lotus Spirit Studio Logo"
        height="80"
      />
    </a>

    <!-- Right: Profile / Login -->
    <div class="ms-auto d-flex align-items-center">
      <a href="login.html" class="nav-link" title="Login / Profile">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             fill="currentColor"
             class="bi bi-person-circle"
             viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
          <path fill-rule="evenodd"
            d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
        </svg>
      </a>
    </div>

  </div>
</nav>

  <h1 class="schedule-title">Class Schedule</h1>
  <div class="divider"></div>

  <!-- Filters -->
  <div class="filters">
    <div class="label">Filter by:</div>

    <select id="serviceFilter" class="filter-select" aria-label="Service filter">
      <option value="ALL">Service (All)</option>
    </select>

    <div class="split" aria-hidden="true"></div>

    <select id="staffFilter" class="filter-select" aria-label="Staff filter">
      <option value="ALL">Staff Member (All)</option>
    </select>
  </div>

  <!-- Week Strip -->
  <div class="week-nav">
    <div class="month-row">
      <button class="chev" id="prevWeek" type="button" aria-label="Previous week">‹</button>
      <div class="month-label" id="monthLabel">February 2026</div>
      <button class="chev" id="nextWeek" type="button" aria-label="Next week">›</button>
    </div>

    <div class="week-strip" id="weekStrip">
      <!-- JS injects day tiles -->
    </div>
  </div>

  <!-- Availability -->
  <div class="availability-wrap">
    <div class="availability-title" id="availabilityTitle">Availability</div>

    <div class="list-card" id="classList">
      <!-- JS injects class rows -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabaseClient.js"></script>

<script>
  let classes = [];

  const weekStrip = document.getElementById("weekStrip");
  const monthLabel = document.getElementById("monthLabel");
  const availabilityTitle = document.getElementById("availabilityTitle");
  const classList = document.getElementById("classList");
  const serviceFilter = document.getElementById("serviceFilter");
  const staffFilter = document.getElementById("staffFilter");

  let currentWeekStart = startOfWeekSunday(new Date());
  let selectedDateKey = null;

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function toKey(d) {
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }

  function startOfWeekSunday(dateObj) {
    const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
    const day = d.getDay();
    d.setDate(d.getDate() - day);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(dateObj, days) {
    const d = new Date(dateObj);
    d.setDate(d.getDate() + days);
    return d;
  }

  function formatMonthYear(dateObj) {
    return dateObj.toLocaleDateString(undefined, {
      month: "long",
      year: "numeric"
    });
  }

  function formatAvailabilityTitle(dateObj) {
    return `Availability for ${dateObj.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    })}`;
  }

  function unique(arr) {
    return [...new Set(arr)].sort();
  }

  function formatTime(timeString) {
    if (!timeString) return "";

    const [hour, minute] = timeString.split(":");
    const date = new Date();
    date.setHours(Number(hour));
    date.setMinutes(Number(minute));

    return date.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });
  }

  async function loadClassesFromSupabase() {
    const today = toKey(new Date());

const { data, error } = await supabaseClient
  .from("classes")
  .select("*")
  .eq("is_active", true)
  .gte("class_date", today)
  .order("class_date", { ascending: true });

    if (error) {
      console.error("Error loading classes:", error);
      classList.innerHTML = `<div class="p-4 text-secondary">Could not load classes.</div>`;
      return;
    }

    classes = data.map(item => ({
      id: item.id,
      date: item.class_date,
      time: formatTime(item.start_time),
      service: item.title,
      location: "Southwest Nimbus Avenue",
      staff: "Jessica Eriksen",
      duration: `${formatTime(item.start_time)} - ${formatTime(item.end_time)}`,
      price: `$${(item.price_cents / 100).toFixed(2)}`
    }));

    buildFilters();
    renderWeek();
  }

  function buildFilters() {
    const services = unique(classes.map(c => c.service));
    const staff = unique(classes.map(c => c.staff));

    serviceFilter.innerHTML = `<option value="ALL">Service (All)</option>`;
    staffFilter.innerHTML = `<option value="ALL">Staff Member (All)</option>`;

    services.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      serviceFilter.appendChild(opt);
    });

    staff.forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      staffFilter.appendChild(opt);
    });
  }

  serviceFilter.addEventListener("change", () => renderAvailability(selectedDateKey));
  staffFilter.addEventListener("change", () => renderAvailability(selectedDateKey));

  function renderWeek() {
    monthLabel.textContent = formatMonthYear(currentWeekStart);
    weekStrip.innerHTML = "";

    for (let i = 0; i < 7; i++) {
      const d = addDays(currentWeekStart, i);
      const key = toKey(d);

      const hasClasses = classes.some(c => c.date === key);

      const pill = document.createElement("div");
      pill.className = "day-pill" + (key === selectedDateKey ? " selected" : "");
      pill.setAttribute("data-date", key);

      const dow = d.toLocaleDateString(undefined, { weekday: "short" });

      pill.innerHTML = `
        <div class="dow">${dow}</div>
        <div class="dom">${d.getDate()}</div>
        <div class="dot">${hasClasses ? "•" : ""}</div>
      `;

      pill.addEventListener("click", () => {
        selectedDateKey = key;
        renderWeek();
        renderAvailability(key);
      });

      weekStrip.appendChild(pill);
    }

    if (!selectedDateKey) {
      selectedDateKey = toKey(currentWeekStart);
      renderWeek();
      renderAvailability(selectedDateKey);
    }
  }

  function renderAvailability(dateKey) {
    if (!dateKey) {
      classList.innerHTML = `<div class="p-4 text-secondary">Select a day to see availability.</div>`;
      return;
    }

    const dateObj = new Date(dateKey + "T00:00:00");
    availabilityTitle.textContent = formatAvailabilityTitle(dateObj);

    const serviceVal = serviceFilter.value;
    const staffVal = staffFilter.value;

    let items = classes.filter(c => c.date === dateKey);

    if (serviceVal !== "ALL") {
      items = items.filter(c => c.service === serviceVal);
    }

    if (staffVal !== "ALL") {
      items = items.filter(c => c.staff === staffVal);
    }

    if (items.length === 0) {
      classList.innerHTML = `<div class="p-4 text-secondary">No classes match your filters for this day.</div>`;
      return;
    }

    classList.innerHTML = items.map(c => `
      <div class="class-row">
        <div class="time">${c.time}</div>

        <div>
          <div class="class-name">${c.service}</div>
          <div class="sub">${c.location}</div>
        </div>

        <div class="meta">
          <div class="staff">${c.staff}</div>
          <div>${c.duration}</div>
          <div>${c.price}</div>
        </div>

        <a class="book-btn" href="booking.html?classId=${c.id}">
          Book
        </a>
      </div>
    `).join("");
  }

  document.getElementById("prevWeek").addEventListener("click", () => {
    currentWeekStart = addDays(currentWeekStart, -7);
    selectedDateKey = toKey(currentWeekStart);
    renderWeek();
    renderAvailability(selectedDateKey);
  });

  document.getElementById("nextWeek").addEventListener("click", () => {
    currentWeekStart = addDays(currentWeekStart, 7);
    selectedDateKey = toKey(currentWeekStart);
    renderWeek();
    renderAvailability(selectedDateKey);
  });

  loadClassesFromSupabase();
</script>
</body>
</html>
