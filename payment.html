<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checkout • Lotus Spirit Studio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  font-family: Manrope, system-ui, sans-serif;
  background:#f6f2ee;
}

.checkout-card{
  max-width:500px;
  margin:auto;
  background:white;
  border-radius:16px;
  padding:2rem;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.btn-primary{
  background:#b89056;
  border-color:#b89056;
}
</style>
</head>

<body>

<div class="container py-5">

<div class="checkout-card">

<h2 class="mb-3">Video Library Membership</h2>

<p class="text-secondary">
Unlimited access to the Lotus Spirit on-demand yoga library.
</p>

<h3 class="mb-4">$19 / month</h3>

<form id="paymentForm">

<div class="mb-3">
<label class="form-label">Card Number</label>
<input class="form-control" placeholder="4242 4242 4242 4242">
</div>

<div class="row">
<div class="col">
<label class="form-label">Expiry</label>
<input class="form-control" placeholder="MM/YY">
</div>

<div class="col">
<label class="form-label">CVC</label>
<input class="form-control" placeholder="123">
</div>
</div>

<button class="btn btn-primary w-100 mt-4">
Complete Payment
</button>

</form>

</div>

</div>

<script src="auth.js"></script>

<script>
document.getElementById("paymentForm").addEventListener("submit",(e)=>{
e.preventDefault()

Auth.setSubscribed(true,"Video Library")

window.location.href="videos.html"
})
</script>

</body>
</html>
