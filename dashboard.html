<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard • Lotus Spirit Studio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Lotus Spirit Studio</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="schedule.html">Schedule</a>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Your Dashboard</h1>
        <p class="text-secondary mb-4" id="welcomeText"></p>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <div class="border rounded p-3 bg-white">
              <h2 class="h6">Bookings</h2>
              <p class="text-secondary mb-0">Coming next (UC-200): view, book, cancel classes.</p>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="border rounded p-3 bg-white">
              <h2 class="h6">Subscription</h2>
              <p class="text-secondary mb-0">Coming next (UC-300): manage your on-demand plan.</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    Auth.requireAuth();

    const user = Auth.getUser();
    document.getElementById("welcomeText").textContent =
      `Logged in as ${user?.email || "user"}.`;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      Auth.logout();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
