<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard • Lotus Spirit Studio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* ===============================
       Manrope Font
    =============================== */
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background-color: #f6f2ee;
    }

    /* ===============================
       Navbar
    =============================== */
    .lotus-navbar {
      background-color: #4d0012;
      padding-top: 1.75rem;
      padding-bottom: 1.75rem;
    }

    .lotus-navbar .navbar-brand,
    .lotus-navbar .nav-link {
      color: #b89056;
      font-weight: 500;
    }

    .lotus-navbar .nav-link:hover {
      color: #ffd9a2;
    }

    .navbar-brand {
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* ===============================
       Card styling
    =============================== */
    .auth-card {
      border: none;
      border-radius: 1rem;
    }

    /* ===============================
       Buttons
    =============================== */
    .btn-primary {
      background-color: #b89056;
      border-color: #b89056;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #ffd9a2;
      border-color: #ffd9a2;
      color: #4d0012;
    }

    .btn-outline-primary {
      border-color: #b89056;
      color: #b89056;
      font-weight: 600;
    }

    .btn-outline-primary:hover {
      background-color: #b89056;
      border-color: #b89056;
      color: #4d0012;
    }

    /* Links */
    a { color: #b89056; }
    a:hover { color: #ffd9a2; }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar lotus-navbar border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Lotus Spirit Studio</a>

      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="nav-link" href="index.html">Home</a>
        <button id="logoutBtn" class="btn btn-outline-primary btn-sm">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm auth-card">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Welcome back</h1>
            <p class="text-secondary mb-4">
              This is your dashboard — manage bookings, subscriptions, and your account.
            </p>

            <div class="row g-3">
              <div class="col-12 col-md-4">
                <div class="p-3 bg-white border rounded-4 h-100">
                  <h2 class="h6 mb-2">Bookings</h2>
                  <p class="text-secondary small mb-3">View or cancel upcoming classes.</p>
                  <a class="btn btn-primary w-100" href="#">View bookings</a>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <div class="p-3 bg-white border rounded-4 h-100">
                  <h2 class="h6 mb-2">Subscription</h2>
                  <p class="text-secondary small mb-3">Manage your on-demand access.</p>
                  <a class="btn btn-primary w-100" href="#">Manage plan</a>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <div class="p-3 bg-white border rounded-4 h-100">
                  <h2 class="h6 mb-2">Profile</h2>
                  <p class="text-secondary small mb-3">Update your account details.</p>
                  <a class="btn btn-primary w-100" href="#">Edit profile</a>
                </div>
              </div>
            </div>

            <hr class="my-4">
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Auth -->
  <script src="auth.js"></script>
  <script>
    // Protect page
    Auth.requireAuth();

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      Auth.logout();
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
