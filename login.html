<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Lotus Spirit Studio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Lotus Spirit Studio</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Home</a>
        <a class="btn btn-primary btn-sm" href="signup.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Login Card -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-2">Log in</h1>
            <p class="text-secondary mb-4">
              Log in to manage your classes and subscriptions.
            </p>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input
                  class="form-control"
                  id="email"
                  type="email"
                  placeholder="you@example.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input
                  class="form-control"
                  id="password"
                  type="password"
                  placeholder="••••••••"
                  required
                />
              </div>

              <button class="btn btn-primary w-100" type="submit">
                Log in
              </button>
            </form>

            <hr class="my-4">

            <p class="mb-0 text-secondary small">
              Don’t have an account?
              <a href="signup.html">Create one here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Auth Logic -->
  <script src="auth.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const alertBox = document.getElementById("loginAlert");

      if (!email || !password) {
        alertBox.textContent = "Please enter your email and password.";
        alertBox.classList.remove("d-none");
        return;
      }

      // ✅ Validate against demo registered users
      const user = Auth.authenticate({ email, password });

      if (!user) {
        alertBox.textContent =
          "Invalid email or password. Try again or sign up.";
        alertBox.classList.remove("d-none");
        return;
      }

      // Login + redirect
      Auth.login({ email });
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
