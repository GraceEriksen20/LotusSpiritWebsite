<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Watch Video • Lotus Spirit Studio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  font-family: Manrope, system-ui, sans-serif;
  background:#f6f2ee;
}

.video-wrapper{
  max-width:900px;
  margin:auto;
}

.video-frame{
  width:100%;
  height:500px;
  border-radius:12px;
}

.loading{
  text-align:center;
  padding:4rem 0;
  color:#6d5b5d;
}
</style>
</head>

<body>

<div class="container py-5">

<h1 id="videoTitle" class="mb-4"></h1>

<div id="loadingMessage" class="loading">
  Checking subscription access...
</div>

<div class="video-wrapper d-none" id="videoWrapper">
  <iframe
    id="videoFrame"
    class="video-frame"
    src=""
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>

</div>

<script src="auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>

<script>

const videos = [
{
  title: "Morning Flow",
  level: "All Levels",
  length: "1 hr 35min",
  image: "images/VIdeo1.png",
  url: "https://www.youtube.com/embed/mCqoybQwzrw"
},
{
title: "Hatha Vinyasa • Slow Flow",
        level: "Beginner–Intermediate",
        length: "1 hr 35min",
        image: "images/video2.png",
        url: "https://drive.google.com/file/d/11hZSuVh8Bo1Z7mgA_J4Xh3Cmxt6r7y4W/preview"
},
{
        title: "Universal Yoga • Strength + Breath",
        level: "All Levels",
        length: "1 hr 35min",
        image: "images/video3.png",
        url: "https://drive.google.com/file/d/1qHlTYrz-m4yEPIHxlB5cjE0bEplaUwbD/preview"
      },
{
        title: "Nervous System Reset • Calm",
        level: "All Levels",
        length: "1 hr 35min",
        image: "images/video4.png",
        url: "https://drive.google.com/file/d/1zBxhA1Hm1waw5Uy9Srgz3vguSQQaMrS-/preview"
      },
{
        title: "Core + Balance",
        level: "Intermediate",
        length: "1 hr 35min",
        image: "images/video5.png",
        url: "https://drive.google.com/file/d/1YreXJ0UAzLTC84cF35zncLU8Gc6ysbTe/preview"
      },
{
        title: "Evening Wind Down",
        level: "All Levels",
        length: "1 hr 35min",
        image: "images/video6.png",
        url: "https://drive.google.com/file/d/1IkHZXJ8pwt8FZM6uR51Xmyjcnqobfkdb/preview"
      }
];

async function checkAccess() {

  if (!Auth.isLoggedIn()) {
    window.location.href = "login.html?returnTo=watch.html";
    return;
  }

  const user = Auth.getUser();

  console.log("Checking subscription for:", user.email);

  const { data, error } = await supabaseClient
    .from("subscriptions")
    .select("*")
    .eq("customer_email", user.email)
    .eq("status", "active")
    .maybeSingle();

  console.log("Subscription data:", data);
  console.log("Subscription error:", error);

  if (error || !data) {
    window.location.href = "subscribe.html";
    return;
  }

  loadVideo();
}

function loadVideo() {

  const params = new URLSearchParams(window.location.search);
  const videoIndex = params.get("video");

  const video = videos[videoIndex];

  if (!video) {
    document.getElementById("loadingMessage").textContent =
      "Video not found.";
    return;
  }

  document.getElementById("loadingMessage").classList.add("d-none");

  document.getElementById("videoWrapper").classList.remove("d-none");

  document.getElementById("videoTitle").textContent = video.title;

  document.getElementById("videoFrame").src = video.url;
}

checkAccess();

</script>

</body>
</html>
