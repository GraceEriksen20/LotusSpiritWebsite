<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Watch Video • Lotus Spirit Studio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  font-family: Manrope, system-ui, sans-serif;
  background:#f6f2ee;
}

.video-wrapper{
  max-width:900px;
  margin:auto;
}

.video-frame{
  width:100%;
  height:500px;
  border-radius:12px;
}

.loading{
  text-align:center;
  padding:4rem 0;
  color:#6d5b5d;
}
</style>
</head>

<body>

<div class="container py-5">

<h1 id="videoTitle" class="mb-4"></h1>

<div id="loadingMessage" class="loading">
  Checking subscription access...
</div>

<div class="video-wrapper d-none" id="videoWrapper">
  <iframe
    id="videoFrame"
    class="video-frame"
    src=""
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>

</div>

<script src="auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>

<script>

const videos = [
{
title:"Deep Stretch • Hips + Hamstrings",
url:"https://www.youtube.com/embed/v7AYKMP6rOE"
},
{
title:"Hatha Vinyasa • Slow Flow",
url:"https://www.youtube.com/embed/4pKly2JojMw"
},
{
title:"Universal Yoga • Strength + Breath",
url:"https://www.youtube.com/embed/6hJ7vE6C1oA"
},
{
title:"Nervous System Reset • Calm",
url:"https://www.youtube.com/embed/2OEL4P1Rz04"
},
{
title:"Core + Balance",
url:"https://www.youtube.com/embed/b1H3xO3x_Js"
},
{
title:"Evening Wind Down",
url:"https://www.youtube.com/embed/ZToicYcHIOU"
}
];

async function checkAccess() {

  if (!Auth.isLoggedIn()) {
    window.location.href = "login.html?returnTo=watch.html";
    return;
  }

  const user = Auth.getUser();

  console.log("Checking subscription for:", user.email);

  const { data, error } = await supabaseClient
    .from("subscriptions")
    .select("*")
    .eq("customer_email", user.email)
    .eq("status", "active")
    .maybeSingle();

  console.log("Subscription data:", data);
  console.log("Subscription error:", error);

  if (error || !data) {
    window.location.href = "subscribe.html";
    return;
  }

  loadVideo();
}

function loadVideo() {

  const params = new URLSearchParams(window.location.search);
  const videoIndex = params.get("video");

  const video = videos[videoIndex];

  if (!video) {
    document.getElementById("loadingMessage").textContent =
      "Video not found.";
    return;
  }

  document.getElementById("loadingMessage").classList.add("d-none");

  document.getElementById("videoWrapper").classList.remove("d-none");

  document.getElementById("videoTitle").textContent = video.title;

  document.getElementById("videoFrame").src = video.url;
}

checkAccess();

</script>

</body>
</html>
