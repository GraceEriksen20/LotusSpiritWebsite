<!doctype html>

  <!-- Bootstrap CSS -->

  <style>

       Manrope Font
    =============================== */
    @font-face {

    .lotus-navbar .nav-link {

      font-weight: 500;
    }

    .lotus-navbar .nav-link:hover {
      color: #ffd9a2;
    }

    .lotus-navbar svg {

    .lotus-navbar svg:hover {

    .lotus-navbar .navbar-brand img {
