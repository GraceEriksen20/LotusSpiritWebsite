<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>My Bookings • Lotus Spirit Studio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('fonts/Manrope-Regular.ttf') format('truetype');
    }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #f6f2ee;
    }

    .lotus-navbar {
      background-color: #4d0012;
      padding-top: 1.75rem;
      padding-bottom: 1.75rem;
    }

    .lotus-navbar .navbar-brand,
    .lotus-navbar .nav-link {
      color: #b89056;
      font-weight: 500;
    }

    .lotus-navbar .nav-link:hover {
      color: #ffd9a2;
    }

    .page-card {
      border: none;
      border-radius: 1.25rem;
      overflow: hidden;
    }

    .booking-card {
      background: white;
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid rgba(0,0,0,0.08);
      margin-bottom: 1rem;
    }

    .muted {
      color: #6d5b5d;
    }

    .section-title {
      margin-top: 3rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>

<body>

<nav class="navbar lotus-navbar border-bottom">
  <div class="container">

    <a class="navbar-brand" href="index.html">
      Lotus Spirit Studio
    </a>

    <div class="ms-auto d-flex align-items-center gap-3">
      <a class="nav-link" href="dashboard.html">
        Dashboard
      </a>

      <a class="nav-link" href="schedule.html">
        Schedule
      </a>
    </div>

  </div>
</nav>

<main class="container py-5">

  <div class="row justify-content-center">
    <div class="col-12 col-xl-9">

      <div class="card shadow-sm page-card">
        <div class="card-body p-4 p-md-5">

          <h1 class="h2 mb-2">
            My Bookings
          </h1>

          <p class="muted mb-5">
            View your upcoming and past Lotus Spirit Studio classes.
          </p>

          <!-- Upcoming -->
          <div>
            <h2 class="h4 section-title">
              Upcoming Classes
            </h2>

            <div id="upcomingBookings">
              <div class="muted">
                Loading bookings...
              </div>
            </div>
          </div>

          <!-- Past -->
          <div>
            <h2 class="h4 section-title">
              Past Classes
            </h2>

            <div id="pastBookings">
              <div class="muted">
                Loading bookings...
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

</main>

<script src="auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>

<script>

if (!Auth.isLoggedIn()) {
  window.location.href =
    "login.html?returnTo=bookings.html";
}

const user = Auth.getUser();

async function loadBookings() {

  const { data, error } = await supabaseClient
    .from("bookings")
    .select(`
      *,
      classes (
        title,
        class_date,
        start_time,
        end_time
      )
    `)
    .eq("customer_email", user.email)
    .order("created_at", {
      ascending: false
    });

  const upcomingContainer =
    document.getElementById("upcomingBookings");

  const pastContainer =
    document.getElementById("pastBookings");

  if (error) {

    console.error(error);

    upcomingContainer.innerHTML = `
      <div class="text-danger">
        Could not load bookings.
      </div>
    `;

    pastContainer.innerHTML = "";

    return;
  }

  if (!data || data.length === 0) {

    upcomingContainer.innerHTML = `
      <div class="muted">
        No bookings yet.
      </div>
    `;

    pastContainer.innerHTML = `
      <div class="muted">
        No past classes.
      </div>
    `;

    return;
  }

  const today = new Date();

  const upcoming = [];
  const past = [];

  data.forEach(booking => {

    const classDate =
      new Date(booking.classes?.class_date);

    if (classDate >= today) {
      upcoming.push(booking);
    } else {
      past.push(booking);
    }
  });

  upcomingContainer.innerHTML =
    upcoming.length > 0
      ? upcoming.map(renderBooking).join("")
      : `
        <div class="muted">
          No upcoming bookings.
        </div>
      `;

  pastContainer.innerHTML =
    past.length > 0
      ? past.map(renderBooking).join("")
      : `
        <div class="muted">
          No past classes.
        </div>
      `;
}

function renderBooking(booking) {

  return `
    <div class="booking-card">

      <div class="fw-semibold h5 mb-2">
        ${booking.classes?.title || "Yoga Class"}
      </div>

      <div class="muted mb-1">
        ${booking.classes?.class_date || ""}
      </div>

      <div class="muted">
        ${booking.classes?.start_time || ""}
        -
        ${booking.classes?.end_time || ""}
      </div>

    </div>
  `;
}

loadBookings();

</script>

</body>
</html>
